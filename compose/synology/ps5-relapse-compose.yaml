services:
  relapse-dns:
    image: alpine:3.24
    container_name: relapse-dns
    # Host networking so dnsmasq can bind UDP/TCP 53 without port-map quirks.
    # Requires Docker on Linux (Docker Desktop "host" mode is not equivalent).
    network_mode: host
    restart: unless-stopped
    # Install dnsmasq at start so we stay on a plain Alpine image.
    cap_add:
      - NET_BIND_SERVICE
    # Binding :53 often also needs elevated privileges on hardened hosts.
    # Uncomment if dnsmasq cannot bind port 53:
    # privileged: true
    command: ["sh", "-c", "apk add --no-cache dnsmasq >/dev/null && dnsmasq -k --log-facility=-"]
    volumes:
      - ${LOCAL_PREFIX-/volume1/Docker}/ps5-relapse/dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
    logging:
      driver: loki
      options:
        loki-url: "http://loki.${NETWORK_DOMAIN-bricksandblocks.net}:3100/loki/api/v1/push"
        loki-retries: 5
        max-size: 100m
        mode: "non-blocking"

  relapse-web:
    image: nginx:alpine
    container_name: relapse-web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${SERVER_IP:-0.0.0.0}:80:80"
      - "${SERVER_IP:-0.0.0.0}:443:443"
    volumes:
      - ${LOCAL_PREFIX-/volume1/Docker}/ps5-relapse/www:/usr/share/nginx/html:ro
      - ${LOCAL_PREFIX-/volume1/Docker}/ps5-relapse/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${LOCAL_PREFIX-/volume1/Docker}/ps5-relapse/certs:/etc/nginx/certs:ro
    depends_on:
      - relapse-dns
    logging:
      driver: loki
      options:
        loki-url: "http://loki.${NETWORK_DOMAIN-bricksandblocks.net}:3100/loki/api/v1/push"
        loki-retries: 5
        max-size: 100m
        mode: "non-blocking"