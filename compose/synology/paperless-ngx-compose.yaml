services:
  paperless-broker:
    image: docker.io/library/redis:8
    container_name: paperless-broker
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - ${LOCAL_PREFIX-/volume1/Docker}/paperless-ngx/redis:/data
    logging:
      driver: loki
      options:
        loki-url: "http://loki.${NETWORK_DOMAIN-bricksandblocks.net}:3100/loki/api/v1/push"
        loki-retries: 5
        max-size: 100m
        mode: "non-blocking"

  paperless-db:
    image: docker.io/library/postgres:17
    container_name: paperless-db
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: ${PAPERLESS_DATABASE_USER}
      POSTGRES_PASSWORD: ${PAPERLESS_DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAPERLESS_DATABASE_USER} -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ${LOCAL_PREFIX-/volume1/Docker}/paperless-ngx/postgres:/var/lib/postgresql/data
    logging:
      driver: loki
      options:
        loki-url: "http://loki.${NETWORK_DOMAIN-bricksandblocks.net}:3100/loki/api/v1/push"
        loki-retries: 5
        max-size: 100m
        mode: "non-blocking"

  paperless-webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-webserver
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    depends_on:
      paperless-db:
        condition: service_healthy
      paperless-broker:
        condition: service_healthy
    environment:
      PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
      PAPERLESS_CONSUMER_POLLING: ${PAPERLESS_CONSUMER_POLLING}
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: ${PAPERLESS_DATABASE_USER}
      PAPERLESS_DBPASS: ${PAPERLESS_DATABASE_PASSWORD}
      PAPERLESS_LOGOUT_REDIRECT_URL: .../application/o/paperless/end-session/
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY-}
      PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS: "true"
      PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
      PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "true"
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: '{"openid_connect":{"OAUTH_PKCE_ENABLED":true,"SCOPE":["openid","profile","email"],"APPS":[{"provider_id":"authentik","name":"authentik","client_id":"${PAPERLESS_OIDC_CLIENT_ID}","secret":"${PAPERLESS_OIDC_CLIENT_SECRET}","settings":{"server_url":"https://authentik.${NETWORK_DOMAIN-bricksandblocks.net}/application/o/paperless/.well-known/openid-configuration","fetch_userinfo":true}}]}}'
      PAPERLESS_TIME_ZONE: ${PAPERLESS_TIME_ZONE-America/Los_Angeles}
      PAPERLESS_URL: https://paperless.${NETWORK_DOMAIN-bricksandblocks.net}
      USERMAP_GID: ${USERMAP_GID-50}
      USERMAP_UID: ${USERMAP_UID-1028}
    ports:
      - "8010:8000"
    volumes:
      - ${LOCAL_PREFIX-/volume1/Docker}/paperless-ngx/data:/usr/src/paperless/data
      - ${LOCAL_PREFIX-/volume1/Docker}/paperless-ngx/media:/usr/src/paperless/media
      - ${LOCAL_PREFIX-/volume1/Docker}/paperless-ngx/export:/usr/src/paperless/export
      - ${SCANNER_PREFIX-/volume1/Scanner}/consume:/usr/src/paperless/consume
    logging:
      driver: loki
      options:
        loki-url: "http://loki.${NETWORK_DOMAIN-bricksandblocks.net}:3100/loki/api/v1/push"
        loki-retries: 5
        max-size: 100m
        mode: "non-blocking"
