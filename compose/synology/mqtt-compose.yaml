services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    user: "1028:50" # UID=1028, GID=50 ('staff' on non-Synology hosts)
    security_opt: ['no-new-privileges:true']
    ports:
      - "1883:1883"
      #- "8883:8883"
      #- "9001:9001"
    volumes:
      - ${LOCAL_PREFIX-/volume1/Docker}/mqtt/config:/mosquitto/config
      - ${LOCAL_PREFIX-/volume1/Docker}/mqtt/data:/mosquitto/data
      - ${LOCAL_PREFIX-/volume1/Docker}/mqtt/log:/mosquitto/log
    logging:
      driver: loki
      options:
        loki-url: "http://loki.${NETWORK_DOMAIN-bricksandblocks.net}:3100/loki/api/v1/push"
        loki-retries: 5
        max-size: 100m
        mode: "non-blocking"