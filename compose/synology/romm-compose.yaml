services:
  romm-db:
    image: docker.io/library/postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc # Postgres 18.7
    container_name: romm-db
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    environment:
      POSTGRES_DB: romm
      POSTGRES_USER: ${ROMM_DB_USER-romm-user}
      POSTGRES_PASSWORD: ${ROMM_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ROMM_DB_USER-romm-user} -d romm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ${LOCAL_PREFIX-/volume1/Docker}/romm/postgres:/var/lib/postgresql
    logging:
      driver: loki
      options:
        loki-url: "http://loki.${NETWORK_DOMAIN-bricksandblocks.net}:3100/loki/api/v1/push"
        loki-retries: 5
        max-size: 100m
        mode: "non-blocking"

  romm:
    # 'latest'/version tags are the full image (EmulatorJS cores bundled); '-slim' needs a CDN at play time
    image: docker.io/rommapp/romm:5.4.1@sha256:8677fb7b81b1d3db20b849e989a1dadc2a11159e51eb34a2acdcb01102274edf # v5.4.1
    container_name: romm
    user: "1028:50" # 'staff' user/group
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    depends_on:
      romm-db:
        condition: service_healthy
        restart: true
    environment:
      ROMM_BASE_URL: https://romm.${NETWORK_DOMAIN-bricksandblocks.net}
      ROMM_DB_DRIVER: postgresql
      DB_HOST: romm-db
      DB_PORT: 5432
      DB_NAME: romm
      DB_USER: ${ROMM_DB_USER-romm-user}
      DB_PASSWD: ${ROMM_DB_PASSWORD}
      ROMM_AUTH_SECRET_KEY: ${ROMM_AUTH_SECRET_KEY} # openssl rand -hex 32
      # Metadata providers: only contacted during scans/metadata refresh, results are cached locally
      HASHEOUS_API_ENABLED: ${ROMM_HASHEOUS_API_ENABLED-true}
      IGDB_CLIENT_ID: ${ROMM_IGDB_CLIENT_ID-}
      IGDB_CLIENT_SECRET: ${ROMM_IGDB_CLIENT_SECRET-}
      RETROACHIEVEMENTS_API_KEY: ${ROMM_RETROACHIEVEMENTS_API_KEY-}
      SCREENSCRAPER_PASSWORD: ${ROMM_SCREENSCRAPER_PASSWORD-}
      SCREENSCRAPER_USER: ${ROMM_SCREENSCRAPER_USER-}
      STEAMGRIDDB_API_KEY: ${ROMM_STEAMGRIDDB_API_KEY-}
      SCAN_WORKERS: ${ROMM_SCAN_WORKERS-2} # DS-class CPUs: keep low
      WEB_SERVER_CONCURRENCY: ${ROMM_WEB_SERVER_CONCURRENCY-2}
      # Authentik SSO (application slug 'romm'); leave OIDC_ENABLED=false until the provider exists
      OIDC_ENABLED: ${ROMM_OIDC_ENABLED-false}
      OIDC_PROVIDER: authentik
      OIDC_CLIENT_ID: ${ROMM_OIDC_CLIENT_ID-}
      OIDC_CLIENT_SECRET: ${ROMM_OIDC_CLIENT_SECRET-}
      OIDC_REDIRECT_URI: https://romm.${NETWORK_DOMAIN-bricksandblocks.net}/api/oauth/openid
      OIDC_SERVER_APPLICATION_URL: https://authentik.${NETWORK_DOMAIN-bricksandblocks.net}/application/o/romm
      OIDC_RP_INITIATED_LOGOUT: "true"
      OIDC_END_SESSION_ENDPOINT: https://authentik.${NETWORK_DOMAIN-bricksandblocks.net}/application/o/romm/end-session/
      # Group-to-role mapping: once OIDC_CLAIM_ROLES is set, every user must match a mapped group
      OIDC_CLAIM_ROLES: ${ROMM_OIDC_CLAIM_ROLES-}
      OIDC_ROLE_ADMIN: ${ROMM_OIDC_ROLE_ADMIN-}
      OIDC_ROLE_VIEWER: ${ROMM_OIDC_ROLE_VIEWER-}
      TZ: America/Los_Angeles
    ports:
      - "8085:8080"
    volumes:
      - ${LOCAL_PREFIX-/volume1/Docker}/romm/resources:/romm/resources
      - ${LOCAL_PREFIX-/volume1/Docker}/romm/redis:/redis-data
      - ${LOCAL_PREFIX-/volume1/Docker}/romm/config:/romm/config
      - ${LOCAL_PREFIX-/volume1/Docker}/romm/assets:/romm/assets
      - ${GAMES_PREFIX-/volume1/Games}:/romm/library # parent of roms/ (and bios/): RomM expects /romm/library/roms/{platform}
    logging:
      driver: loki
      options:
        loki-url: "http://loki.${NETWORK_DOMAIN-bricksandblocks.net}:3100/loki/api/v1/push"
        loki-retries: 5
        max-size: 100m
        mode: "non-blocking"
