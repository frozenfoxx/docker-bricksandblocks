services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    restart: always
    deploy:
      resources:
        limits:
          memory: 1000M
    environment:
      ALLOW_SIGNUP: false
      # Landing group/household for accounts created via OIDC; move users afterwards
      DEFAULT_GROUP: BricksandBlocks
      DEFAULT_HOUSEHOLD: Users
      BASE_URL: https://mealie.${NETWORK_DOMAIN-bricksandblocks.net}
      #LOG_LEVEL: debug
      MAX_WORKERS: 1
      PUID: 1000
      PGID: 1000
      TZ: America/Los_Angeles
      WEB_CONCURRENCY: 1
      # Database Settings
      DB_ENGINE: postgres
      PG_USER: ${MEALIE_PG_USER}
      POSTGRES_USER: ${MEALIE_PG_USER}
      POSTGRES_PASSWORD: ${MEALIE_PG_PASSWORD}
      POSTGRES_SERVER: mealie-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: mealie
      # OIDC via authentik
      OIDC_AUTH_ENABLED: true
      OIDC_PROVIDER_NAME: authentik
      OIDC_CONFIGURATION_URL: https://authentik.${NETWORK_DOMAIN-bricksandblocks.net}/application/o/mealie/.well-known/openid-configuration
      OIDC_CLIENT_ID: ${MEALIE_OIDC_CLIENT_ID:?OIDC client ID required}
      OIDC_CLIENT_SECRET: ${MEALIE_OIDC_CLIENT_SECRET:?OIDC client secret required}
      OIDC_USER_GROUP: mealie-users
      OIDC_ADMIN_GROUP: mealie-admins
      # authentik sends email_verified=false; accounts are invite-only there
      OIDC_REQUIRES_EMAIL_VERIFICATION: false
    ports:
        - "9925:9000"
    volumes:
      - mealie-data:/app/data/
    extends:
      file: ${ROOT_DIR-../..}/lib/logging.yml
      service: logging-loki
    depends_on:
      mealie-postgres:
        condition: service_healthy

  mealie-postgres:
    image: postgres:15
    container_name: mealie-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${MEALIE_PG_PASSWORD}
      POSTGRES_USER: ${MEALIE_PG_USER}
    volumes:
      - mealie-postgres-data:/var/lib/postgresql/data
    extends:
      file: ${ROOT_DIR-../..}/lib/logging.yml
      service: logging-loki
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  mealie-data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${DATA_HOST},nolock,soft,rw"
      device: ":/volume1/Docker/mealie"

  mealie-postgres-data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${DATA_HOST},nolock,soft,rw"
      device: ":/volume1/Docker/mealie-postgres"