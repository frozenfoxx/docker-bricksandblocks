---
services:
  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:latest
    container_name: linkwarden
    restart: always
    user: "1028:50" # UID=1028, 'staff' user, GID=50, 'staff' group
    environment:
      - AUTOSCROLL_TIMEOUT=${LINKWARDEN_AUTOSCROLL-30}
      # Authentik SSO, issuer must not have a trailing slash
      - AUTHENTIK_CLIENT_ID=${LINKWARDEN_OIDC_CLIENT_ID}
      - AUTHENTIK_CLIENT_SECRET=${LINKWARDEN_OIDC_CLIENT_SECRET}
      - AUTHENTIK_CUSTOM_NAME=${LINKWARDEN_OIDC_NAME-Authentik}
      - AUTHENTIK_ISSUER=https://authentik.${NETWORK_DOMAIN-bricksandblocks.net}/application/o/linkwarden
      - DATABASE_URL=postgres://${LINKWARDEN_DATABASE_USER}:${LINKWARDEN_DATABASE_PASSWD}@linkwarden-postgres:5432/${LINKWARDEN_DATABASE_NAME-linkwarden}
      - NEXTAUTH_URL=https://linkwarden.${NETWORK_DOMAIN-bricksandblocks.net}/api/v1/auth
      - NEXTAUTH_SECRET=${LINKWARDEN_SECRET}
      - NEXT_PUBLIC_AUTHENTIK_ENABLED=${LINKWARDEN_OIDC_ENABLED-true}
      - NEXT_PUBLIC_DISABLE_REGISTRATION=${LINKWARDEN_DISABLE_REGISTRATION-true} # Note: set false to enable signups
      - PAGINATION_TAKE_COUNT=${LINKWARDEN_PAGINATION_COUNT-50}
      - RE_ARCHIVE_LIMIT=${LINKWARDEN_ARCHIVE_LIMIT-5}
      - STORAGE_FOLDER=${LINKWARDEN_STORAGE-/data}
    ports:
      - "3080:3000"
    volumes:
      - ${LOCAL_PREFIX-/local}/linkwarden/data:/data/data
    extends:
      file: ${ROOT_DIR-../..}/lib/logging.yml
      service: logging-loki
    depends_on:
      linkwarden-postgres:
        condition: service_healthy

  linkwarden-postgres:
    image: postgres:18-alpine
    container_name: linkwarden-postgres
    restart: always
    environment:
      - POSTGRES_USER=${LINKWARDEN_DATABASE_USER}
      - POSTGRES_PASSWORD=${LINKWARDEN_DATABASE_PASSWD}
      - POSTGRES_DB=${LINKWARDEN_DATABASE_NAME-linkwarden}
    volumes:
      # Databases use a local bind mount, not NFS, see ../../docs/Backups.md
      - ${LOCAL_PREFIX-/local}/linkwarden-postgres:/var/lib/postgresql/data
    extends:
      file: ${ROOT_DIR-../..}/lib/logging.yml
      service: logging-loki
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 30s
      timeout: 20s
      retries: 3
