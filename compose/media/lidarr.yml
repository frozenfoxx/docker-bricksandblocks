---
services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    environment:
      - PUID=1028 # 'staff' user
      - PGID=50 # 'staff' group
      - TZ=America/Los_Angeles
    volumes:
      #- lidarr-config:/config
      #- lidarr-custom-services:/custom-services.d
      #- lidarr-custom-cont-init:/custom-cont-init.d
      - ${LOCAL_PREFIX-/local}/lidarr/config:/config
      # Extended with arr-scripts: https://github.com/RandomNinjaAtk/arr-scripts/blob/main/lidarr/readme.md
      - ${LOCAL_PREFIX-/local}/lidarr/custom-services:/custom-services.d
      - ${LOCAL_PREFIX-/local}/lidarr/custom-cont-init:/custom-cont-init.d
      - lidarr-data:/data
    ports:
      - 8786:8686
    extends:
      file: ${ROOT_DIR-../..}/lib/logging.yml
      service: logging-loki

volumes:
  #lidarr-config:
  #  driver: local
  #  driver_opts:
  #    type: nfs
  #    o: "addr=${DATA_HOST},nolock,soft,rw"
  #    device: ":/volume1/Docker/lidarr/config"

  #lidarr-custom-services:
  #  driver: local
  #  driver_opts:
  #    type: nfs
  #    o: "addr=${DATA_HOST},nolock,soft,rw"
  #    device: ":/volume1/Docker/lidarr/custom-services"

  #lidarr-custom-cont-init:
  #  driver: local
  #  driver_opts:
  #    type: nfs
  #    o: "addr=${DATA_HOST},nolock,soft,rw"
  #    device: ":/volume1/Docker/lidarr/custom-cont-init"

  lidarr-data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${MEDIA_HOST},nolock,soft,rw"
      device: ":/volume1/Media"