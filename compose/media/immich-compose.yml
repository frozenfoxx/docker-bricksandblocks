---
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd # v3.4.2
    container_name: immich-server
    restart: always
    volumes:
      - immich-data:/data:rw
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env.immich
    ports:
      - '2283:2283'
    depends_on:
      - immich-redis
      - immich-postgres
    healthcheck:
      disable: false
    extends:
      file: ${ROOT_DIR-..}/lib/logging.yml
      service: logging-loki
    #   file: ${ROOT_DIR-..}/lib/immich-hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding

  immich-machine-learning:
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: v3.4.2-cuda, with that tag's own digest
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.2@sha256:739405742a79bd7447227c553bb62ed5491aa36acf00bc667af7f9c93b6fae91 # v3.4.2
    container_name: immich-machine-learning
    volumes:
      - immich-model-cache:/cache
    env_file:
      - .env.immich
    restart: always
    healthcheck:
      disable: false
    extends:
      file: ${ROOT_DIR-..}/lib/logging.yml
      service: logging-loki
    # uncomment this section for hardware acceleration - see https://docs.immich.app/features/ml-hardware-acceleration
    #   file: ${ROOT_DIR-..}/lib/immich-hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable

  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7 # 9.1.3
    container_name: immich-redis
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping || exit 1
    extends:
      file: ${ROOT_DIR-..}/lib/logging.yml
      service: logging-loki

  immich-postgres:
    image: ghcr.io/immich-app/postgres:18-vectorchord1.1.1@sha256:f7388adc1e3414800a71506528917f4f5615249f5fe7a872b1e1431e01b72ad7 # Postgres 18 + VectorChord 1.1.1 + pgvector 0.8.5
    container_name: immich-postgres
    shm_size: 128mb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${IMMICH_DATABASE_USER}
      POSTGRES_PASSWORD: ${IMMICH_DATABASE_PASSWD}
      POSTGRES_DB: ${IMMICH_DATABASE_NAME-immich}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Postgres 18+ keeps data under /var/lib/postgresql/<major>/docker, so mount the parent.
      # Major version changes need a dump and restore, see ../../docs/Postgres.md
      #- immich-postgres-data:/var/lib/postgresql
      - ${LOCAL_PREFIX-/local}/immich-postgres:/var/lib/postgresql
    extends:
      file: ${ROOT_DIR-..}/lib/logging.yml
      service: logging-loki
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  immich-data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${DATA_HOST},nolock,soft,rw"
      device: ":/volume1/Docker/immich/data"

  immich-model-cache:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${DATA_HOST},nolock,soft,rw"
      device: ":/volume1/Docker/immich/model-cache"

  # immich-postgres-data:
  #   driver: local
  #   driver_opts:
  #     type: nfs
  #     o: "addr=${DATA_HOST},nolock,soft,rw"
  #     device: ":/volume1/Docker/immich/postgres"
