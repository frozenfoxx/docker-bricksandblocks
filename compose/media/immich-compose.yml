---
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.2.2@sha256:79cc1623323d5894922686d8743b4780181428f98eecbfb58ce12c41ef02d1ea # v3.2.2
    container_name: immich-server
    restart: always
    volumes:
      - immich-data:/data:rw
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env.immich
    ports:
      - '2283:2283'
    depends_on:
      - immich-redis
      - immich-postgres
    healthcheck:
      disable: false
    extends:
      file: ${ROOT_DIR-..}/lib/logging.yml
      service: logging-loki
    #   file: ${ROOT_DIR-..}/lib/immich-hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding

  immich-machine-learning:
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: v3.2.2-cuda, with that tag's own digest
    image: ghcr.io/immich-app/immich-machine-learning:v3.2.2@sha256:60dfcf266a9ef3b7376f5678e8c980d4fb61db5fc48c078fe8a326ab1535d60d # v3.2.2
    container_name: immich-machine-learning
    volumes:
      - immich-model-cache:/cache
    env_file:
      - .env.immich
    restart: always
    healthcheck:
      disable: false
    extends:
      file: ${ROOT_DIR-..}/lib/logging.yml
      service: logging-loki
    # uncomment this section for hardware acceleration - see https://docs.immich.app/features/ml-hardware-acceleration
    #   file: ${ROOT_DIR-..}/lib/immich-hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable

  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:8436e10bc65c94886a91d4415b6a6dfa9cb5a306fb3b996e5bb67cd2b4854193 # 9.0.4
    container_name: immich-redis
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping || exit 1
    extends:
      file: ${ROOT_DIR-..}/lib/logging.yml
      service: logging-loki

  immich-postgres:
    image: ghcr.io/immich-app/postgres:18-vectorchord1.1.1@sha256:e53734de78ebf59a92261033c7dca61f789d925b79e7b68883f65b016cf27ed7 # Postgres 18 + VectorChord 1.1.1 + pgvector 0.8.5
    container_name: immich-postgres
    shm_size: 128mb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${IMMICH_DATABASE_USER}
      POSTGRES_PASSWORD: ${IMMICH_DATABASE_PASSWD}
      POSTGRES_DB: ${IMMICH_DATABASE_NAME-immich}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Postgres 18+ keeps data under /var/lib/postgresql/<major>/docker, so mount the parent.
      # Major version changes need a dump and restore, see ../../docs/Postgres.md
      #- immich-postgres-data:/var/lib/postgresql
      - ${LOCAL_PREFIX-/local}/immich-postgres:/var/lib/postgresql
    extends:
      file: ${ROOT_DIR-..}/lib/logging.yml
      service: logging-loki
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  immich-data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${DATA_HOST},nolock,soft,rw"
      device: ":/volume1/Docker/immich/data"

  immich-model-cache:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${DATA_HOST},nolock,soft,rw"
      device: ":/volume1/Docker/immich/model-cache"

  # immich-postgres-data:
  #   driver: local
  #   driver_opts:
  #     type: nfs
  #     o: "addr=${DATA_HOST},nolock,soft,rw"
  #     device: ":/volume1/Docker/immich/postgres"
