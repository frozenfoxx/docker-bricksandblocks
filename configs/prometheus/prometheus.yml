global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules.yml

alerting:
  alertmanagers:
    - static_configs:
      - targets:
        - alert-manager:9093

scrape_configs:
  - job_name: 'container'
    file_sd_configs:
      - files:
        - 'targets-cadvisor.yml'

  - job_name: 'node'
    file_sd_configs:
      - files:
        - 'targets-node-exporter.yml'

  - job_name: 'prometheus'
    static_configs:
      - targets:
         - prometheus:9090

  - job_name: 'synology'
    scrape_interval: 60s
    file_sd_configs:
      - files:
        - 'targets-snmp-synology.yml'
    metrics_path: /snmp
    params:
      module: [synology, if_mib, ucd_system_stats, ucd_memory, system]
      auth: [synology]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: host.fqdn:9116

  - job_name: 'traefik'
    file_sd_configs:
      - files:
        - 'targets-traefik.yml'

  - job_name: vector
    file_sd_configs:
      - files:
        - 'targets-vector.yml'

